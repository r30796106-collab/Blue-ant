[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-ant"
version = "0.1.0"
description = "A deterministic, resource-aware multi-project worker orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Blue Ant Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
blue-ant-review = "blue_ant.subbot_report:main"
blue-ant-workforce = "blue_ant.workforce_cli:main"
blue-ant-patch = "blue_ant.patch_cli:main"
blue-ant-audit-loop = "blue_ant.audit_loop_cli:main"
blue-ant-plan = "blue_ant.development_plan_cli:main"
blue-ant-propose = "blue_ant.controlled_proposal_cli:main"
blue-ant-prepare = "blue_ant.code_preparation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
