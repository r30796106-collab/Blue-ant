name: tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to test
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# Avoid spending runner time on superseded commits of the same pull request.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -n auto --dist worksteal

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Install wheel in a clean virtual environment and smoke-test console scripts
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --no-deps dist/*.whl
          .venv-wheel/bin/python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          scripts = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["scripts"]
          bin_dir = Path(".venv-wheel/bin")
          for name in sorted(scripts):
              executable = bin_dir / name
              if not executable.is_file():
                  raise SystemExit(f"missing installed console script: {name}")
              result = subprocess.run(
                  [str(executable), "--help"],
                  capture_output=True,
                  text=True,
                  timeout=15,
                  check=False,
              )
              if result.returncode != 0 or "usage:" not in result.stdout.lower():
                  raise SystemExit(
                      f"{name} --help failed (exit {result.returncode}): {result.stderr[-2000:]}"
                  )
              print(f"PASS {name} --help")
          PY

  read-only-review:
    needs: [test, package-smoke]
    if: github.event_name == 'pull_request' && needs.test.result == 'success' && needs.package-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only sub-bot fleet
        env:
          PYTHONPATH: blue-ant/src
        run: |
          python -m blue_ant.subbot_report --repo target --output artifacts/report.json
          cat artifacts/report.json
      - name: Upload sub-bot report
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-subbot-report
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 7
