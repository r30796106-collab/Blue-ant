name: tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to test
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest

  read-only-review:
    needs: test
    if: github.event_name == 'pull_request' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only sub-bot fleet
        env:
          PYTHONPATH: blue-ant/src
        run: |
          python -m blue_ant.subbot_report --repo target --output artifacts/report.json
          cat artifacts/report.json
      - name: Upload sub-bot report
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-subbot-report
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 7
