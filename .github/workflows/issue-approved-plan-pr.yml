name: Blue Ant Human-Approved Plan Task Worker

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  approved-plan-task:
    if: github.event.sender.login == 'r30796106-collab' && startsWith(github.event.issue.title, '[blue-ant-plan-pr]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Validate owner-edited plan task and explicit approval
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          BLUE_ANT_WORKER_TOKEN: ${{ secrets.BLUE_ANT_WORKER_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re
          body = os.environ.get("ISSUE_BODY") or ""
          blocks = re.findall(r"```json\s*(.*?)\s*```", body, re.S)
          if len(blocks) != 1:
              raise SystemExit("Issue must contain exactly one structured JSON block")
          data = json.loads(blocks[0])
          required = {"target_repository", "target_ref", "project_id", "plan", "task_id", "replacement_content", "apply_approved"}
          if not isinstance(data, dict) or set(data) != required:
              raise SystemExit("Invalid plan-task instruction schema")
          if data["apply_approved"] is not True:
              raise SystemExit("Explicit apply_approved=true is required")
          repo = data["target_repository"]
          if not isinstance(repo, str) or not re.fullmatch(r"r30796106-collab/[A-Za-z0-9_.-]{1,100}", repo):
              raise SystemExit("Target repository is outside owner scope")
          if repo != os.environ["GITHUB_REPOSITORY"] and not os.environ.get("BLUE_ANT_WORKER_TOKEN"):
              raise SystemExit("Cross-repository writes require BLUE_ANT_WORKER_TOKEN")
          ref = data["target_ref"]
          if (not isinstance(ref, str) or not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", ref)
              or ref.startswith("-") or ".." in ref.split("/") or "//" in ref or ref.endswith(("/", "."))):
              raise SystemExit("Invalid target ref")
          project = data["project_id"]
          if not isinstance(project, str) or not re.fullmatch(r"[a-z][a-z0-9_-]{0,47}", project):
              raise SystemExit("Invalid project_id")
          plan = data["plan"]
          if not isinstance(plan, dict) or plan.get("schema_version") != 1 or plan.get("approval_required") is not True or plan.get("apply_approved") is not False:
              raise SystemExit("Plan must be a schema v1 unapproved human-review plan")
          if plan.get("project_id") != project or plan.get("target_repository") != repo or plan.get("target_ref") != ref:
              raise SystemExit("Plan target/project binding mismatch")
          task_id = data["task_id"]
          if not isinstance(task_id, str) or not task_id or len(task_id) > 128:
              raise SystemExit("Invalid task_id")
          matches = [t for t in plan.get("tasks", []) if isinstance(t, dict) and t.get("task_id") == task_id]
          if len(matches) != 1:
              raise SystemExit("task_id must identify exactly one plan task")
          task = matches[0]
          if task.get("kind") != "audit_finding_review" or task.get("role") == "safety_auditor" or task.get("requires_human_review") is not True:
              raise SystemExit("Task is not eligible for coding; safety findings remain human-only")
          path = task.get("path")
          if (not isinstance(path, str) or not path or path.startswith("/") or "\\" in path
              or any(part in {"", ".", ".."} for part in path.split("/")) or path.split("/")[0] == ".git"):
              raise SystemExit("Task path is not a safe relative file")
          replacement = data["replacement_content"]
          if not isinstance(replacement, str) or not replacement.strip() or len(replacement.encode("utf-8")) > 2_000_000:
              raise SystemExit("replacement_content must contain 1–2,000,000 bytes of text")
          os.makedirs("instruction", exist_ok=True)
          with open("instruction/plan.json", "w", encoding="utf-8") as f:
              json.dump(plan, f, ensure_ascii=False)
          with open("instruction/change.json", "w", encoding="utf-8") as f:
              json.dump({"path": path, "content": replacement}, f, ensure_ascii=False)
          with open("instruction/metadata.json", "w", encoding="utf-8") as f:
              json.dump({"repository": repo, "ref": ref, "project": project, "task_id": task_id, "path": path}, f)
          PY

      - name: Read validated metadata
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open("instruction/metadata.json", encoding="utf-8"))
          for k in ("repository", "ref", "project", "task_id", "path"):
              print(f"{k}={d[k]}")
          PY

      - name: Checkout Blue Ant source
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Checkout target at approved base ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.repository }}
          ref: ${{ steps.meta.outputs.ref }}
          token: ${{ secrets.BLUE_ANT_WORKER_TOKEN || github.token }}
          path: target
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blue Ant proposal and patch tools
        run: python -m pip install -e "blue-ant[dev]"

      - name: Build fresh hash-checked proposal and apply
        run: |
          blue-ant-propose --workspace target --plan instruction/plan.json --task-id "${{ steps.meta.outputs.task_id }}" --change instruction/change.json --output instruction/proposal.json
          blue-ant-patch --workspace target --proposal instruction/proposal.json --approve
          python - <<'PY'
          import json
          proposal=json.load(open("instruction/proposal.json", encoding="utf-8"))
          with open("instruction/changed-paths.nul", "wb") as f:
              for item in proposal["changes"]:
                  f.write(item["path"].encode("utf-8") + bytes([0]))
          PY
          git -C target add --all --pathspec-from-file="$GITHUB_WORKSPACE/instruction/changed-paths.nul" --pathspec-file-nul
          git -C target diff --cached --check
          git -C target diff --cached --quiet && { echo "No changes to commit"; exit 1; } || true

      - name: Create branch and commit
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PROJECT: ${{ steps.meta.outputs.project }}
        run: |
          BRANCH="blue-ant/plan-issue-${ISSUE_NUMBER}-run-${RUN_ID}"
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target switch -c "$BRANCH"
          git -C target commit -m "Blue Ant: reviewed plan task ${PROJECT}"
          git -C target push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open target pull request
        env:
          GH_TOKEN: ${{ secrets.BLUE_ANT_WORKER_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ steps.meta.outputs.repository }}
          TARGET_REF: ${{ steps.meta.outputs.ref }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TASK_ID: ${{ steps.meta.outputs.task_id }}
          TASK_PATH: ${{ steps.meta.outputs.path }}
        run: |
          gh pr create --repo "$TARGET_REPOSITORY" --base "$TARGET_REF" --head "$BRANCH" \
            --title "Blue Ant: reviewed task $TASK_ID" \
            --body "Human-approved plan task: $TASK_ID\n\nTarget file: $TASK_PATH\n\nThis PR was created from a hash-checked proposal after an owner-authored issue edit. It is not merged automatically."

      - name: Dispatch Blue Ant checks and target tests
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ steps.meta.outputs.repository }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run subbot-review.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_repository="$TARGET_REPOSITORY" -f target_ref="$BRANCH"
          gh workflow run target-python-tests.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_repository="$TARGET_REPOSITORY" -f target_ref="$BRANCH"

      - name: Report worker outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Plan-task worker finished with status: **' + context.job + '**. Inspect the Actions run and generated target PR. No merge or deployment is performed.'
            });
