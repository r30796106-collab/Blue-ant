name: Blue Ant Sub-bot Review

on:
  pull_request:
    branches: ["main"]
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: ["main", "feat/**", "fix/**", "docs/**"]
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public repository to inspect (owner/name); defaults to this repository
        required: false
        type: string
      target_ref:
        description: Branch, tag, or commit to inspect
        required: false
        default: main
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  read-only-review:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Validate target repository
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          if [ -n "$TARGET_REPOSITORY" ] && ! printf '%s' "$TARGET_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "target_repository must use owner/name format"
            exit 1
          fi
      - name: Resolve pull request for tested commit
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          matches="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/commits/$TESTED_SHA/pulls?per_page=100")"
          pr_number="$(printf '%s' "$matches" | jq -r --arg sha "$TESTED_SHA" '
            [.[] | select(.base.ref == "main" and .head.sha == $sha)] |
            first | .number // empty')"
          if [ -z "$pr_number" ]; then
            echo "No pull request targeting main is associated with tested commit $TESTED_SHA"
            exit 1
          fi
          echo "Resolved PR #$pr_number for tested commit $TESTED_SHA"
      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository || github.repository }}
          ref: ${{ inputs.target_ref || github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.repository.default_branch }}
          path: target
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only sub-bot fleet
        env:
          PYTHONPATH: blue-ant/src
        run: |
          python -m blue_ant.subbot_report --repo target --output artifacts/report.json
      - name: Upload sub-bot report
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-subbot-report
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 7
