name: Blue Ant Sub-bot Review

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public repository to inspect (owner/name); defaults to this repository
        required: false
        type: string
      target_ref:
        description: Branch, tag, or commit to inspect
        required: false
        default: main
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  read-only-review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate target repository
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          if [ -n "$TARGET_REPOSITORY" ] && ! printf '%s' "$TARGET_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "target_repository must use owner/name format"
            exit 1
          fi
      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository || github.repository }}
          ref: ${{ inputs.target_ref || github.event.repository.default_branch }}
          path: target
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only sub-bot fleet
        env:
          PYTHONPATH: blue-ant/src
        run: |
          python -m blue_ant.subbot_report --repo target --output artifacts/report.json
          cat artifacts/report.json
      - name: Upload sub-bot report
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-subbot-report
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 7
