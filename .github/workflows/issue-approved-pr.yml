name: Blue Ant Issue-Driven Approved Coding Worker

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: blue-ant-approved-pr-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  propose-and-open-pr:
    if: github.event.issue.user.login == 'r30796106-collab' && startsWith(github.event.issue.title, '[blue-ant-pr]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit approval and patch proposal
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          BLUE_ANT_WORKER_TOKEN: ${{ secrets.BLUE_ANT_WORKER_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON object key: {key}")
                  result[key] = value
              return result
          data = json.loads(os.environ.get("ISSUE_BODY") or "", object_pairs_hook=unique_object)
          required = {"target_ref", "project_id", "proposal", "apply_approved"}
          allowed = (required, required | {"target_repository"})
          if not isinstance(data, dict) or set(data) not in allowed:
              raise SystemExit("Issue body must contain the required fields and optional target_repository")
          target_repository = data.get("target_repository", os.environ["GITHUB_REPOSITORY"])
          if (not isinstance(target_repository, str)
              or not re.fullmatch(r"r30796106-collab/[A-Za-z0-9_.-]{1,100}", target_repository)):
              raise SystemExit("target_repository must be a public repository under r30796106-collab")
          if target_repository != os.environ["GITHUB_REPOSITORY"] and not os.environ.get("BLUE_ANT_WORKER_TOKEN"):
              raise SystemExit("Cross-repository writes require the BLUE_ANT_WORKER_TOKEN secret")
          ref = data["target_ref"]
          if (not isinstance(ref, str) or not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", ref)
              or ref.startswith("-") or ".." in ref or "//" in ref or ref.endswith(("/", "."))):
              raise SystemExit("Invalid target_ref")
          project = data["project_id"]
          if not isinstance(project, str) or not re.fullmatch(r"[a-z][a-z0-9_-]{0,47}", project):
              raise SystemExit("Invalid project_id")
          if data["apply_approved"] is not True:
              raise SystemExit("Refusing write: apply_approved must be true after human review")
          proposal = data["proposal"]
          required_proposal = {"proposal_id", "project_id", "task_id", "changes"}
          if not isinstance(proposal, dict) or set(proposal) != required_proposal:
              raise SystemExit("Invalid proposal schema")
          for field in ("proposal_id", "project_id", "task_id"):
              value = proposal[field]
              if not isinstance(value, str) or not value.strip() or len(value) > 128:
                  raise SystemExit(f"Invalid {field}")
          if proposal["project_id"] != project:
              raise SystemExit("Proposal project_id must match instruction project_id")
          changes = proposal["changes"]
          if not isinstance(changes, list) or not changes or len(changes) > 10:
              raise SystemExit("Proposal must contain 1–10 changes")
          total = 0
          seen = set()
          for change in changes:
              if not isinstance(change, dict) or set(change) != {"path", "content", "expected_sha256"}:
                  raise SystemExit("Each change must contain exactly path, content, expected_sha256")
              path, content = change["path"], change["content"]
              if not isinstance(path, str) or not isinstance(content, str):
                  raise SystemExit("Patch path and content must be strings")
              if path in seen:
                  raise SystemExit("Duplicate patch path")
              seen.add(path)
              total += len(content.encode("utf-8"))
              digest = change["expected_sha256"]
              if digest is not None and (not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest)):
                  raise SystemExit("expected_sha256 must be null or a lowercase SHA-256 digest")
          if total > 2_000_000:
              raise SystemExit("Proposal exceeds 2 MB")
          instruction_dir = os.path.join(os.environ["RUNNER_TEMP"], "blue-ant-instruction")
          os.makedirs(instruction_dir, exist_ok=True)
          with open(os.path.join(instruction_dir, "proposal.json"), "w", encoding="utf-8") as f:
              json.dump(proposal, f, ensure_ascii=False)
          with open(os.path.join(instruction_dir, "metadata.json"), "w", encoding="utf-8") as f:
              json.dump({"target_ref": ref, "project_id": project, "target_repository": target_repository}, f)
          PY

      - name: Read validated metadata
        id: instruction
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON object key: {key}")
                  result[key] = value
              return result
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "blue-ant-instruction", "metadata.json"), encoding="utf-8"), object_pairs_hook=unique_object)
          print("target_ref=" + data["target_ref"])
          print("project_id=" + data["project_id"])
          print("target_repository=" + data["target_repository"])
          PY

      - name: Checkout Blue Ant worker source
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Reject duplicate issue execution before target checkout
        env:
          GH_TOKEN: ${{ secrets.BLUE_ANT_WORKER_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ steps.instruction.outputs.target_repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BRANCH="blue-ant/issue-${ISSUE_NUMBER}"
          EXISTING_PR="$(gh api --paginate "repos/${TARGET_REPOSITORY}/pulls?state=all&per_page=100" --jq "[.[] | select(.head.ref == \"${BRANCH}\" and .head.repo.full_name == \"${TARGET_REPOSITORY}\") | {number, state, html_url}] | .[]")"
          if [ -n "${EXISTING_PR}" ]; then
            echo "::error::This instruction already created a pull request for stable branch ${BRANCH}: ${EXISTING_PR}"
            exit 1
          fi
          EXISTING_REFS="$(gh api "repos/${TARGET_REPOSITORY}/git/matching-refs/heads/${BRANCH}" --jq 'length')"
          if [ "${EXISTING_REFS}" != "0" ]; then
            echo "::error::Stable branch ${BRANCH} already exists without a discoverable PR. Manual reconciliation is required; refusing to overwrite it."
            exit 1
          fi
      - name: Checkout target repository at approved base ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.instruction.outputs.target_repository }}
          ref: ${{ steps.instruction.outputs.target_ref }}
          token: ${{ secrets.BLUE_ANT_WORKER_TOKEN || github.token }}
          path: target
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blue Ant patch engine
        run: python -m pip install -e "blue-ant[dev]"

      - name: Apply hash-checked approved proposal
        run: |
          blue-ant-patch --workspace target --proposal "$RUNNER_TEMP/blue-ant-instruction/proposal.json" --approve
          python - <<'PY'
          import json, os
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON object key: {key}")
                  result[key] = value
              return result
          proposal = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "blue-ant-instruction", "proposal.json"), encoding="utf-8"), object_pairs_hook=unique_object)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "blue-ant-instruction", "changed-paths.nul"), "wb") as f:
              for item in proposal["changes"]:
                  f.write(item["path"].encode("utf-8") + bytes([0]))
          PY
          git -C target add --all --pathspec-from-file="$RUNNER_TEMP/blue-ant-instruction/changed-paths.nul" --pathspec-file-nul
          git -C target diff --cached --check
          if git -C target diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi

      - name: Upload approved patch audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-patch-audit-${{ github.event.issue.number }}
          path: target/.blue-ant/patch-audit.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: Create branch and commit
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROJECT_ID: ${{ steps.instruction.outputs.project_id }}
        run: |
          BRANCH="blue-ant/issue-${ISSUE_NUMBER}"
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target switch -c "$BRANCH"
          git -C target commit -m "Blue Ant: approved patch for ${PROJECT_ID}"
          git -C target push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.BLUE_ANT_WORKER_TOKEN || github.token }}
          TARGET_REF: ${{ steps.instruction.outputs.target_ref }}
          TARGET_REPOSITORY: ${{ steps.instruction.outputs.target_repository }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROJECT_ID: ${{ steps.instruction.outputs.project_id }}
        run: |
          python - <<'PY'
          import os
          body = "\n".join([
              "## Blue Ant approved coding worker",
              "",
              "- Project: " + os.environ["PROJECT_ID"],
              "- Source instruction: #" + os.environ["ISSUE_NUMBER"],
              "- Patch was applied only after explicit human approval.",
              "- The hash-chained patch audit log is retained as a workflow artifact for 14 days.",
              "- Review the complete diff and wait for required CI checks before merging.",
              "",
              "This workflow does not merge the pull request."
          ]) + "\n"
          with open(os.path.join(os.environ["RUNNER_TEMP"], "blue-ant-pr-body.md"), "w", encoding="utf-8") as f:
              f.write(body)
          PY
          gh pr create \
            --repo "$TARGET_REPOSITORY" \
            --base "$TARGET_REF" \
            --head "$BRANCH" \
            --title "Blue Ant: approved patch for $PROJECT_ID" \
            --body-file "$RUNNER_TEMP/blue-ant-pr-body.md"

      - name: Dispatch CI for the created PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TARGET_REPOSITORY: ${{ steps.instruction.outputs.target_repository }}
        run: |
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_ref="$GITHUB_SHA"
          gh workflow run subbot-review.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_repository="$TARGET_REPOSITORY" -f target_ref="$BRANCH"
          gh workflow run target-python-tests.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_repository="$TARGET_REPOSITORY" -f target_ref="$BRANCH"
      
      - name: Report result on instruction issue
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const body = [
              '## Blue Ant coding worker',
              '',
              'Workflow status: **' + (process.env.JOB_STATUS || 'unknown') + '**',
              'The worker requires explicit `apply_approved: true`, validates the patch, and opens a separate pull request. It never merges.',
              'Inspect the Actions run and any generated pull request before proceeding.'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
