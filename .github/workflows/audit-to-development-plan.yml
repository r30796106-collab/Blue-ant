name: Blue Ant Audit-to-Development-Plan Router

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  audit-and-route-plan:
    if: github.event.issue.user.login == 'r30796106-collab' && startsWith(github.event.issue.title, '[blue-ant-plan]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate plan instruction
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re
          data = json.loads(os.environ.get("ISSUE_BODY") or "")
          required = {"instruction_id", "project_id", "repository", "ref", "roles", "max_cycles", "task"}
          if not isinstance(data, dict) or set(data) != required:
              raise SystemExit("Issue body must contain exactly: " + ", ".join(sorted(required)))
          for field in ("instruction_id", "project_id"):
              if not isinstance(data[field], str) or not re.fullmatch(r"[a-z][a-z0-9_-]{0,47}", data[field]):
                  raise SystemExit("Invalid " + field)
          if not isinstance(data["repository"], str) or not re.fullmatch(r"r30796106-collab/[A-Za-z0-9_.-]{1,100}", data["repository"]):
              raise SystemExit("Only public repositories owned by r30796106-collab are allowed")
          ref = data["ref"]
          if (not isinstance(ref, str) or not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", ref)
              or ref.startswith("-") or ".." in ref.split("/") or "//" in ref or ref.endswith(("/", "."))):
              raise SystemExit("Invalid target ref")
          allowed = {"repo_analyst", "test_auditor", "docs_auditor", "safety_auditor"}
          roles = data["roles"]
          if not isinstance(roles, list) or not 1 <= len(roles) <= 4 or any(role not in allowed for role in roles) or len(set(roles)) != len(roles):
              raise SystemExit("roles must be 1–4 unique approved read-only specialist roles")
          cycles = data["max_cycles"]
          if not isinstance(cycles, int) or isinstance(cycles, bool) or not 1 <= cycles <= len(roles):
              raise SystemExit("max_cycles must be between 1 and the number of selected roles")
          task = data["task"]
          if not isinstance(task, str) or not task.strip() or len(task) > 1000 or "\n" in task or "\r" in task:
              raise SystemExit("task context must contain 1–1000 characters")
          os.makedirs("instruction", exist_ok=True)
          with open("instruction/plan.json", "w", encoding="utf-8") as stream:
              json.dump(data, stream)
          PY

      - name: Read validated instruction
        id: instruction
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("instruction/plan.json", encoding="utf-8"))
          for key in ("instruction_id", "project_id", "repository", "ref", "task"):
              print(f"{key}={data[key]}")
          print("roles=" + ",".join(data["roles"]))
          print("max_cycles=" + str(data["max_cycles"]))
          PY

      - name: Checkout Blue Ant source
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Checkout target repository read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.instruction.outputs.repository }}
          ref: ${{ steps.instruction.outputs.ref }}
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blue Ant
        run: python -m pip install -e blue-ant

      - name: Run bounded read-only audit loop
        env:
          PROJECT_ID: ${{ steps.instruction.outputs.project_id }}
          ROLES: ${{ steps.instruction.outputs.roles }}
          MAX_CYCLES: ${{ steps.instruction.outputs.max_cycles }}
          TASK_CONTEXT: ${{ steps.instruction.outputs.task }}
          INSTRUCTION_ID: ${{ steps.instruction.outputs.instruction_id }}
        run: |
          mkdir -p artifacts
          blue-ant-audit-loop \
            --project "$PROJECT_ID=target" \
            --roles "$ROLES" \
            --max-cycles "$MAX_CYCLES" \
            --task "$TASK_CONTEXT" \
            --output "artifacts/$INSTRUCTION_ID-audit.json"

      - name: Generate target-bound development plan
        env:
          PROJECT_ID: ${{ steps.instruction.outputs.project_id }}
          TARGET_REPOSITORY: ${{ steps.instruction.outputs.repository }}
          TARGET_REF: ${{ steps.instruction.outputs.ref }}
          INSTRUCTION_ID: ${{ steps.instruction.outputs.instruction_id }}
        run: |
          blue-ant-plan \
            --project-id "$PROJECT_ID" \
            --audit-report "artifacts/$INSTRUCTION_ID-audit.json" \
            --target-repository "$TARGET_REPOSITORY" \
            --target-ref "$TARGET_REF" \
            --output "artifacts/$INSTRUCTION_ID-plan.json"

      - name: Prepare deterministic documentation repair drafts
        env:
          INSTRUCTION_ID: ${{ steps.instruction.outputs.instruction_id }}
        run: |
          mkdir -p artifacts
          blue-ant-prepare \
            --workspace target \
            --plan "artifacts/$INSTRUCTION_ID-plan.json" \
            --output "artifacts/$INSTRUCTION_ID-prepared-tasks.json"

      - name: Upload audit and development plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-plan-${{ github.run_id }}
          path: |
            artifacts/${{ steps.instruction.outputs.instruction_id }}-audit.json
            artifacts/${{ steps.instruction.outputs.instruction_id }}-plan.json
            artifacts/${{ steps.instruction.outputs.instruction_id }}-prepared-tasks.json
          if-no-files-found: warn
          retention-days: 14

      - name: Return prioritized tasks to the instruction issue
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: artifacts/${{ steps.instruction.outputs.instruction_id }}-audit.json
          PLAN_PATH: artifacts/${{ steps.instruction.outputs.instruction_id }}-plan.json
          PREPARED_PATH: artifacts/${{ steps.instruction.outputs.instruction_id }}-prepared-tasks.json
          INSTRUCTION_ID: ${{ steps.instruction.outputs.instruction_id }}
          PROJECT_ID: ${{ steps.instruction.outputs.project_id }}
          TARGET_REPOSITORY: ${{ steps.instruction.outputs.repository }}
          TARGET_REF: ${{ steps.instruction.outputs.ref }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            let audit = null, plan = null, preparedReport = null;
            try { audit = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8')); } catch (_) {}
            try { plan = JSON.parse(fs.readFileSync(process.env.PLAN_PATH, 'utf8')); } catch (_) {}
            try { preparedReport = JSON.parse(fs.readFileSync(process.env.PREPARED_PATH, 'utf8')); } catch (_) {}
            const preparedByTask = new Map((preparedReport?.prepared_tasks || []).map(item => [item.task_id, item]));
            const tasks = plan?.tasks || [];
            const eligible = tasks.filter(t => t.kind === 'audit_finding_review' && t.role !== 'safety_auditor');
            const safety = tasks.filter(t => t.kind === 'security_human_review');
            const taskLines = tasks.slice(0, 40).map(t =>
              '- **' + t.priority.toUpperCase() + '** ' + t.task_id + ' — ' + t.kind +
              (t.path ? ' — ' + t.path : '') +
              ' (' + t.role + '): ' + t.evidence
            );
            const compactPlan = plan ? JSON.stringify(plan, null, 2) : '';
            const fullPlan = compactPlan && compactPlan.length <= 38000
              ? '\n<details><summary>Full development plan JSON</summary>\n\n' + compactPlan + '\n</details>'
              : '\nFull plan is in the workflow artifact because it is too large for an issue comment.';
            const body = [
              '## Blue Ant audit-to-plan result',
              '',
              '- Workflow: **' + (process.env.JOB_STATUS || 'unknown') + '**',
              '- Instruction: ' + process.env.INSTRUCTION_ID,
              '- Target: ' + process.env.TARGET_REPOSITORY + '@' + process.env.TARGET_REF,
              '- Audit cycles: ' + (audit?.cycles_used ?? 0),
              '- Findings converted to plan tasks: ' + tasks.length,
              '- Patch-eligible review tasks: ' + eligible.length,
              '- Safety findings reserved for human review: ' + safety.length,
              '',
              '### Prioritized task queue',
              '',
              taskLines.length ? taskLines.join('\n') : 'No task entries were produced.',
              tasks.length > 40 ? '\nOnly the first 40 tasks are shown here; see the artifact for the complete plan.' : '',
              '',
              '### Next handoff',
              '',
              'For a suitable audit_finding_review task, independently verify the finding and review the prepared replacement content in the generated task issue. Ambiguous repairs remain blank for manual preparation; only the narrow deterministic Markdown rules are drafted. The task issue still requires an owner edit with apply_approved=true. That worker recalculates the file SHA-256 and opens a PR; it never merges.',
              '',
              'Safety-auditor and security_human_review tasks are never routed to automatic patch application.',
              fullPlan,
              '',
              'This workflow performs read-only audits and plan generation only. It does not edit the target repository, execute target code, install target dependencies, or approve/apply changes.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000)
            });
            // Create one unapproved task issue for each eligible existing-file review.
            // Safety findings and every other task kind remain human-only.
            if (process.env.JOB_STATUS === 'success' && plan) {
              for (const task of eligible) {
                if (!task || typeof task.task_id !== 'string' || typeof task.path !== 'string' || !task.path ||
                    task.path.startsWith('/') || task.path.split('/').includes('..') || task.path.includes('\\') || task.path.includes(String.fromCharCode(0))) continue;
                const prepared = preparedByTask.get(task.task_id);
                const draftContent = prepared?.status === 'prepared' && typeof prepared.content === 'string' && prepared.content.length <= 30000 ? prepared.content : '';
                const preparationNote = draftContent
                  ? 'Blue Ant prepared a deterministic draft using strategy: ' + prepared.strategy + '. Review every line before approval.'
                  : 'Blue Ant could not safely prepare this change automatically. Write the complete replacement content yourself after verifying the finding.';
                const taskPlan = { schema_version: plan.schema_version, plan_id: plan.plan_id, project_id: plan.project_id, target_repository: plan.target_repository, target_ref: plan.target_ref, tasks: [task], approval_required: true, apply_approved: false };
                const taskPayload = { target_repository: process.env.TARGET_REPOSITORY, target_ref: process.env.TARGET_REF, project_id: process.env.PROJECT_ID, plan: taskPlan, task_id: task.task_id, replacement_content: draftContent, apply_approved: false };
                const taskBody = [
                  '## Blue Ant draft coding task', '',
                  '- Source audit instruction: #' + context.issue.number,
                  '- Target: ' + process.env.TARGET_REPOSITORY + '@' + process.env.TARGET_REF,
                  '- Task: ' + task.task_id, '- File: ' + task.path, '- Finding: ' + task.evidence, '',
                  '### Human action required', '',
                  'Independently verify the finding and inspect the replacement_content draft. ' + preparationNote + ' If confirmed, ensure replacement_content contains the complete correct content for exactly this existing file, then set apply_approved to true. Save the issue edit as the repository owner. No worker runs on issue creation; it only runs after an owner-authored edit with explicit approval.', '',
                  'Safety-auditor findings are never eligible for this route.', '',
                  '### Structured instruction', '', '```json', JSON.stringify(taskPayload, null, 2), '```'
                ].join('\n');
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: '[blue-ant-plan-pr] ' + task.task_id + ' — ' + task.path, body: taskBody });
              }
            }
