name: Blue Ant Approved Patch Worker

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Public target repository in owner/name form"
        required: true
        type: string
        default: "r30796106-collab/Blue-ant"
      target_ref:
        description: "Target branch, tag, or commit"
        required: true
        type: string
        default: "main"
      project_id:
        description: "Registered project slug used in the proposal"
        required: true
        type: string
        default: "blue-ant"
      patch_proposal_json:
        description: "Complete strict Blue Ant patch proposal JSON"
        required: true
        type: string
      apply_approved:
        description: "Explicitly approve applying the patch in this disposable runner checkout"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and write proposal
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          PROJECT_ID: ${{ inputs.project_id }}
          PROPOSAL_JSON: ${{ inputs.patch_proposal_json }}
        run: |
          python - <<'PY'
          import json, os, re
          repository = os.environ["TARGET_REPOSITORY"]
          ref = os.environ["TARGET_REF"]
          project_id = os.environ["PROJECT_ID"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("Target must be a public owner/name repository coordinate")
          if not ref or len(ref) > 200 or ref.startswith("-") or ".." in ref or any(c in ref for c in " ~^:?*[\\\\"):
              raise SystemExit("Invalid target ref")
          if not re.fullmatch(r"[a-z][a-z0-9_-]{0,47}", project_id):
              raise SystemExit("Invalid project_id")
          proposal = json.loads(os.environ["PROPOSAL_JSON"])
          if not isinstance(proposal, dict) or set(proposal) != {"proposal_id", "project_id", "task_id", "changes"}:
              raise SystemExit("Proposal must contain exactly proposal_id, project_id, task_id, changes")
          if proposal["project_id"] != project_id:
              raise SystemExit("Proposal project_id does not match workflow input")
          if not isinstance(proposal["changes"], list) or not proposal["changes"] or len(proposal["changes"]) > 50:
              raise SystemExit("Proposal must contain 1–50 changes")
          for change in proposal["changes"]:
              if not isinstance(change, dict) or set(change) != {"path", "content", "expected_sha256"}:
                  raise SystemExit("Each change must contain exactly path, content, expected_sha256")
              if not isinstance(change["path"], str) or not isinstance(change["content"], str):
                  raise SystemExit("Patch path and content must be strings")
              digest = change["expected_sha256"]
              if digest is not None and (not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest)):
                  raise SystemExit("expected_sha256 must be null or a lowercase SHA-256 digest")
          os.makedirs("blue-ant-input", exist_ok=True)
          with open("blue-ant-input/proposal.json", "w", encoding="utf-8") as stream:
              json.dump(proposal, stream, ensure_ascii=False)
          PY

      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Checkout public target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
          path: workspace
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blue Ant
        run: python -m pip install -e "blue-ant[dev]"

      - name: Review or apply approved patch
        env:
          APPLY_APPROVED: ${{ inputs.apply_approved }}
        run: |
          mkdir -p artifacts
          if [ "$APPLY_APPROVED" = "true" ]; then
            blue-ant-patch --workspace workspace --proposal blue-ant-input/proposal.json --approve
          else
            blue-ant-patch --workspace workspace --proposal blue-ant-input/proposal.json
          fi
          git -C workspace diff --no-ext-diff --binary > artifacts/patch-result.diff
          cp blue-ant-input/proposal.json artifacts/proposal.json
          printf '%s\\n' "$APPLY_APPROVED" > artifacts/applied.txt

      - name: Publish patch result
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-patch-result-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
