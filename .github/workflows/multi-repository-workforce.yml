name: Blue Ant Multi-Repository Workforce

on:
  workflow_dispatch:
    inputs:
      projects_json:
        description: 'JSON array: [{"project_id":"repo-a","repository":"owner/repo","ref":"main"}]'
        required: true
        type: string
        default: '[{"project_id":"blue-ant","repository":"r30796106-collab/Blue-ant","ref":"main"}]'

permissions:
  contents: read

jobs:
  workforce:
    name: Workforce / ${{ matrix.project.project_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(inputs.projects_json) }}
    steps:
      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Validate project coordinates
        env:
          PROJECT_ID: ${{ matrix.project.project_id }}
          TARGET_REPOSITORY: ${{ matrix.project.repository }}
        run: |
          python - <<'PY'
          import os, re
          project_id = os.environ["PROJECT_ID"]
          repository = os.environ["TARGET_REPOSITORY"]
          if not re.fullmatch(r"[a-z][a-z0-9_-]{0,47}", project_id):
              raise SystemExit("Invalid project_id")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("Invalid public repository coordinate")
          PY

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repository }}
          ref: ${{ matrix.project.ref }}
          path: targets/${{ matrix.project.project_id }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blue Ant
        run: python -m pip install -e "blue-ant[dev]"

      - name: Run parallel specialist workforce
        env:
          PROJECT_ID: ${{ matrix.project.project_id }}
        run: |
          mkdir -p artifacts
          blue-ant-workforce \
            --project "$PROJECT_ID=targets/$PROJECT_ID" \
            --max-workers 4 \
            --output "artifacts/$PROJECT_ID-report.json"

      - name: Upload workforce report
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-workforce-${{ matrix.project.project_id }}
          path: artifacts/${{ matrix.project.project_id }}-report.json
          retention-days: 7
