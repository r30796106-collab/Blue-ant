name: Blue Ant Multi-Repository Workforce

on:
  workflow_dispatch:
    inputs:
      project_ids:
        description: 'JSON array of registered project IDs; defaults to all four projects'
        required: true
        type: string
        default: '["blue-ant","elon","ai-trading","voicestudio"]'
      snapshot_sources:
        description: "Create bounded private source snapshots for specialist tasks"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate registered project selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project IDs against the checked-in allowlist
        id: matrix
        env:
          PROJECT_IDS: ${{ inputs.project_ids }}
          TARGET_REPO_TOKEN: ${{ secrets.BLUE_ANT_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${#PROJECT_IDS}" -gt 4096 ]; then
            echo "Project selection exceeds the input size limit"
            exit 1
          fi
          if printf '%s' "$PROJECT_IDS" | grep -q 'ai-trading' && [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "The private ai-trading repository requires BLUE_ANT_WORKER_TOKEN; no checkout was attempted."
            exit 1
          fi
          matrix="$(PYTHONPATH=blue-ant/src python -m blue_ant.portfolio_cli --registry blue-ant/config/portfolio.json --project-ids "$PROJECT_IDS")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  workforce:
    name: Workforce / ${{ matrix.project.project_id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout Blue Ant worker
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Checkout registered target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repository }}
          ref: ${{ matrix.project.ref }}
          token: ${{ secrets.BLUE_ANT_WORKER_TOKEN || github.token }}
          path: targets/${{ matrix.project.project_id }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blue Ant
        run: python -m pip install -e "blue-ant[dev]"

      - name: Run fixed read-only specialist workforce
        env:
          PROJECT_ID: ${{ matrix.project.project_id }}
          AUDITED_BASELINE_SHA: ${{ matrix.project.audited_baseline_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(
            --project "$PROJECT_ID=targets/$PROJECT_ID"
            --max-workers 4
            --output "artifacts/$PROJECT_ID-report.json"
          )
          if [ "${{ inputs.snapshot_sources }}" = "true" ]; then
            args+=(--snapshot-sources)
          fi
          blue-ant-workforce "${args[@]}"
          printf '{"project_id":"%s","repository":"%s","ref":"%s","audited_baseline_sha":"%s"}\n' \
            "$PROJECT_ID" "${{ matrix.project.repository }}" "${{ matrix.project.ref }}" \
            "$AUDITED_BASELINE_SHA" > "artifacts/$PROJECT_ID-baseline.json"

      - name: Upload workforce report
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-workforce-${{ matrix.project.project_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
