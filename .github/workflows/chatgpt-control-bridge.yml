name: Blue Ant ChatGPT Control Bridge V3

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  bridge-command:
    if: github.event.issue.user.login == 'r30796106-collab' && startsWith(github.event.issue.title, '[blue-ant-bridge]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Blue Ant bridge
        uses: actions/checkout@v4
        with:
          path: blue-ant
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blue Ant
        run: python -m pip install -e blue-ant

      - name: Validate bridge command
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p instruction artifacts
          printf '%s' "$ISSUE_BODY" > instruction/raw-command.json
          blue-ant-bridge --input instruction/raw-command.json --output instruction/command.json

      - name: Read validated command metadata
        id: command
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON object key: {key}")
                  result[key] = value
              return result
          command = json.load(open("instruction/command.json", encoding="utf-8"), object_pairs_hook=unique_object)
          for key in ("command_id", "project_id", "repository", "ref", "task"):
              print(f"{key}={command[key]}")
          print("roles=" + ",".join(command["roles"]))
          print("max_cycles=" + str(command["max_cycles"]))
          PY

      - name: Checkout target repository read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.command.outputs.repository }}
          ref: ${{ steps.command.outputs.ref }}
          path: target
          persist-credentials: false

      - name: Run parallel read-only specialists and deterministic controller
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          blue-ant-bridge-runner \
            --command instruction/command.json \
            --target-path target \
            --output-dir artifacts

      - name: Upload bridge result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-ant-bridge-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Return result to command issue
        if: always()
        uses: actions/github-script@v7
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          PROJECT_ID: ${{ steps.command.outputs.project_id }}
          TARGET_REPOSITORY: ${{ steps.command.outputs.repository }}
          TARGET_REF: ${{ steps.command.outputs.ref }}
          AUDIT_PATH: artifacts/${{ steps.command.outputs.command_id }}-audit.json
          PLAN_PATH: artifacts/${{ steps.command.outputs.command_id }}-plan.json
          DECISION_PATH: artifacts/${{ steps.command.outputs.command_id }}-decision.json
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            let audit = null, plan = null, decision = null;
            try { audit = JSON.parse(fs.readFileSync(process.env.AUDIT_PATH, 'utf8')); } catch (_) {}
            try { plan = JSON.parse(fs.readFileSync(process.env.PLAN_PATH, 'utf8')); } catch (_) {}
            try { decision = JSON.parse(fs.readFileSync(process.env.DECISION_PATH, 'utf8')); } catch (_) {}
            const tasks = plan?.tasks || [];
            const body = [
              '## Blue Ant ChatGPT bridge result',
              '',
              '- Status: **' + (process.env.JOB_STATUS || 'unknown') + '**',
              '- Command: ' + (process.env.COMMAND_ID || 'validation failed'),
              '- Target: ' + (process.env.TARGET_REPOSITORY || 'not resolved') + '@' + (process.env.TARGET_REF || 'not resolved'),
              '- Parallel workers completed: ' + (audit?.cycles_used ?? 0),
              '- Audit chain: ' + (audit?.execution_audit?.valid ? 'verified (' + audit.execution_audit.records + ' records)' : 'unavailable or invalid'),
              '- Controller decision: **' + (decision?.action || 'unavailable') + '**',
              '- Plan tasks: ' + tasks.length,
              '',
              '### Review queue',
              '',
              ...(tasks.length ? tasks.slice(0, 30).map(t => '- **' + String(t.priority).toUpperCase() + '** ' + t.task_id + ' — ' + t.kind + (t.path ? ' — ' + t.path : '') + ': ' + t.evidence) : ['No plan tasks were produced.']),
              '',
              '### Handoff',
              '',
              'Blue Ant V3 dispatches the selected read-only specialists concurrently, generates a deterministic plan, and evaluates the result automatically. Findings stop the workflow for human review. This workflow does not generate or apply code, run target tests, install target dependencies, merge PRs, or deploy.',
              '',
              'Full JSON reports are in the workflow artifact.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000)
            });
